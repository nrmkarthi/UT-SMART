[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "utsmart"
version = "1.0.0"
description = "UT-SMART: uncertainty-aware twin-assisted semantic multi-agent edge intelligence for connected AUVs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["utsmart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
